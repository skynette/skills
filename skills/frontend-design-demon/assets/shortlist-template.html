<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference shortlist</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e4e2dd; --badge:#efece6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1d1d1d; --ink:#ededed; --muted:#9a9a9a; --line:#2c2c2c; --badge:#262626; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { padding:40px 16px 8px; max-width:1400px; margin:0 auto; }
  h1 { font-size:22px; font-weight:600; margin:0 0 4px; letter-spacing:-0.01em; }
  header p { margin:0; color:var(--muted); }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px; padding:24px 16px 64px; max-width:1400px; margin:0 auto; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  figure a.shot { display:block; aspect-ratio:4/3; overflow:hidden; background:var(--badge); }
  figure img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; transition:transform .3s ease; }
  figure a.shot:hover img { transform:scale(1.02); }
  figcaption { padding:12px 14px 14px; display:grid; gap:6px; }
  .row { display:flex; align-items:center; gap:8px; }
  .num { font-weight:600; font-variant-numeric:tabular-nums; }
  .src { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--badge); color:var(--muted); }
  .note { color:var(--ink); }
  .link { font-size:13px; color:var(--muted); word-break:break-all; }
</style>
</head>
<body>
<header>
  <h1>Pick 4–5 references</h1>
  <p><!--HEADER--></p>
  <p>Reply with the numbers you want, and what you like about each.</p>
</header>
<main>
<!--GRID-->
</main>
</body>
</html>
